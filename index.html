<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EARN9JA | Earn More</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --green:#075b42;
  --dark:#06432f;
  --gold:#e9b949;
  --light:#f4f7f5;
  --white:#ffffff;
  --text:#26352e;
  --muted:#78877f;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--text);
}

button {
  cursor:pointer;
  border:0;
  font-weight:bold;
}

header {
  background:linear-gradient(135deg,var(--dark),var(--green));
  color:white;
  padding:22px;
}

.header-inner {
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo {
  font-size:27px;
  font-weight:900;
  color:white;
}

.logo span {
  color:var(--gold);
}

.tagline {
  font-size:12px;
  color:#d7e9df;
  margin-top:5px;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:22px 15px 100px;
}

.card {
  background:white;
  padding:20px;
  border-radius:17px;
  box-shadow:0 4px 18px rgba(0,0,0,.04);
  border:1px solid #edf0ed;
}

.space {
  margin-bottom:18px;
}

input,textarea {
  width:100%;
  padding:14px;
  border:1px solid #dce5df;
  border-radius:10px;
  margin:7px 0;
  font-size:15px;
  outline:none;
}

input:focus,textarea:focus {
  border-color:var(--green);
}

textarea {
  min-height:90px;
}

.primary {
  background:var(--green);
  color:white;
  padding:14px;
  border-radius:10px;
  width:100%;
  margin-top:10px;
}

.secondary {
  background:#e8f2ec;
  color:var(--green);
  padding:13px;
  border-radius:10px;
  width:100%;
  margin-top:10px;
}

.gold {
  color:var(--gold);
}

.hidden {
  display:none !important;
}

.message {
  padding:14px;
  background:#e5f5eb;
  color:#075b42;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
  overflow-wrap:anywhere;
}

.hero {
  background:linear-gradient(130deg,#06432f,#08704e);
  border-radius:20px;
  padding:25px;
  color:white;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}

.hero:after {
  content:"₦";
  position:absolute;
  right:20px;
  top:0;
  font-size:140px;
  font-weight:bold;
  color:rgba(255,255,255,.07);
}

.hero h2 {
  font-size:23px;
  margin-bottom:8px;
}

.hero p {
  color:#d8e9df;
  font-size:14px;
}

.balance {
  font-size:34px;
  font-weight:900;
  margin:18px 0;
  color:var(--gold);
}

.stats {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
  margin-bottom:20px;
}

.stat {
  background:white;
  padding:18px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.stat small {
  color:var(--muted);
}

.stat h3 {
  font-size:22px;
  margin-top:9px;
  color:var(--green);
}

.section-title {
  font-size:19px;
  font-weight:800;
  margin-bottom:16px;
}

.task {
  border:1px solid #e8eee9;
  padding:16px;
  border-radius:13px;
  margin-bottom:13px;
}

.task h3 {
  color:var(--green);
  margin-bottom:8px;
}

.reward {
  color:#a47712;
  font-weight:bold;
  margin:10px 0;
}

.task button {
  background:var(--green);
  color:white;
  padding:11px 16px;
  border-radius:9px;
}

.item {
  padding:13px 0;
  border-bottom:1px solid #edf0ed;
  overflow-wrap:anywhere;
}

.item:last-child {
  border-bottom:0;
}

.admin-heading {
  background:var(--dark);
  color:white;
  padding:20px;
  border-radius:15px;
}

.bottom-nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  box-shadow:0 -3px 15px rgba(0,0,0,.08);
  display:flex;
  justify-content:space-around;
  padding:12px 5px;
  z-index:10;
}

.bottom-nav button {
  background:none;
  color:var(--green);
  font-size:12px;
}

footer {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:25px;
}

@media(min-width:700px) {
  .stats {
    grid-template-columns:repeat(4,1fr);
  }

  .auth-card {
    max-width:450px;
    margin:35px auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="logo">EARN<span>9JA</span></div>
      <p class="tagline">Earn through verified micro-tasks</p>
    </div>
    <div class="gold">★ Rewards</div>
  </div>
</header>

<main class="container">

<div id="message" class="message"></div>

<!-- AUTHENTICATION -->

<section id="auth" class="card auth-card space">

<h2 style="color:var(--green);margin-bottom:8px">
Welcome to EARN9JA
</h2>

<p style="color:var(--muted);margin-bottom:15px">
Your journey to earning rewards starts here.
</p>

<div id="registerFields">
<input id="name" placeholder="Full name">
<input id="phone" placeholder="Phone number">
</div>

<input id="email" type="email" placeholder
